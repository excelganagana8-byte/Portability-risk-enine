openapi: 3.1.0
info:
  title: PRE Scanner API
  version: 0.1.3
  description: Public Shopify storefront assessment API.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health
  /api/scan:
    post:
      summary: Scan a public storefront
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Scan report
        '400':
          description: Invalid request
        '429':
          description: Rate limited
        '502':
          description: Scan failed
